
name: GameConsole CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validar y construir GameConsole
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verificar JavaScript
        run: |
          node --check backend/server.js
          node --check frontend/app.js
          node --check frontend/gameStats.js
          node --check frontend/games/ticTacToe.js
          node --check frontend/games/snake.js
          node --check frontend/games/memory.js

      - name: Construir imagen del backend
        run: docker build -f backend/Dockerfile -t gameconsole-backend .

      - name: Construir imagen del frontend
        run: docker build -f frontend/Dockerfile -t gameconsole-frontend .

  publish:
    name: Publicar imágenes Docker
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar nombre del repositorio
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}-backend:latest

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}-frontend:latest
